# On a push that changes code: engine syntax, sample specs of every project valid, a still renders, studio builds.
# Not on the engine's own commits (imported specs, lessons, used verses): they change no code, and CI ran
# on every one of them (870 of 3,194 Actions minutes in October 2026). A newer push cancels a running check.
name: CI
on:
  push:
    branches: [main]
    paths: ['engine/**', 'app/**', 'lib/**', 'components/**', 'scripts/**', 'package.json', 'package-lock.json', 'next.config.*', 'tsconfig.json',
      'projects/*/project.json', 'projects/*/content/samples/**', '.github/workflows/ci.yml', '.github/actions/**']
  pull_request: {}
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
defaults: { run: { shell: bash } }   # bash -eo pipefail: a failing script fails the step despite | tee
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-engine
        with: { render: 'true', dev: 'true' }
      - run: for f in $(find engine scripts -name '*.mjs'); do node --check "$f"; done
      - name: Sample specs of every enabled project
        run: node engine/cli/each.mjs engine/cli/validate.mjs samples
      - name: Studio project list is up to date (run node scripts/sync-projects.mjs)
        run: node scripts/sync-projects.mjs && git diff --exit-code lib/projects.generated.json
      - name: Render one still per enabled project (a whole reel costs minutes; the render jobs make those)
        run: |
          for p in $(node engine/cli/projects.mjs --json | tr -d '[]"' | tr ',' ' '); do
            d=projects/$p/content/samples; [ -d "$d" ] || continue
            still=$(grep -l '"kind": *"verse-still\|"kind": *"post-' $d/*.json | head -1 || true)
            [ -n "$still" ] && PROJECT=$p node engine/render/render.mjs $still
          done
      - run: npm run build
        env: { MONGODB_URI: 'mongodb://localhost:27017', STUDIO_PASSWORD: ci }
