# Every morning (schedule saved by AlexLamper), per enabled project (one after the other): Claude plans one day -
# the first day from tomorrow that has no content yet (specs + comment replies, on Mondays the week report) -,
# the engine validates, imports and renders it, and Alex gets one message. The file keeps its old name
# (plan-week.yml) because the studio's timer dispatches it by that name.
name: Plan day
# Started daily at 04:00 UTC by the studio's timer (Vercel Cron, /api/cron/plan); GitHub's own schedule is not
# used here so the planner can never run twice. By hand: Actions > Plan day > Run workflow.
# export-context sets skip=true when enough is waiting already (20+ items to make or review, or 25+ approved on the pile; PLAN_FORCE overrides).
on:
  workflow_dispatch:
    inputs:
      project: { description: 'Only this project (empty = every enabled project)', required: false, default: '' }
permissions: { contents: write, issues: write, id-token: write, actions: write }
defaults: { run: { shell: bash } }   # bash -eo pipefail: a failing script fails the step despite | tee
jobs:
  projects:
    runs-on: ubuntu-latest
    outputs: { list: '${{ steps.p.outputs.list }}' }
    steps:
      - uses: actions/checkout@v4
      - id: p
        env: { ONLY: '${{ inputs.project }}' }
        run: echo "list=$(node engine/cli/projects.mjs --json ${ONLY:+--only "$ONLY"})" >> "$GITHUB_OUTPUT"
  plan:
    needs: projects
    if: needs.projects.outputs.list != '[]'
    strategy: { matrix: { project: '${{ fromJSON(needs.projects.outputs.list) }}' }, fail-fast: false, max-parallel: 1 }
    concurrency: { group: 'planner-${{ matrix.project }}', cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-engine
        with: { render: 'true' }
      - name: Export context for the planner (picks the day to plan)
        id: ctx
        env: { SECRETS: '${{ toJSON(secrets) }}' }
        run: node engine/cli/export-context.mjs 2>&1 | tee -a run.log
      - name: Planner token (GitHub secret, or pasted in the studio)
        if: steps.ctx.outputs.skip != 'true'
        id: token
        env: { SECRETS: '${{ toJSON(secrets) }}' }
        run: node engine/cli/studio-secret.mjs CLAUDE_CODE_OAUTH_TOKEN
      - name: Today
        if: steps.ctx.outputs.skip != 'true'
        run: echo "TODAY=$(TZ=Europe/Amsterdam date '+%A %d %B %Y, ISO week %G-W%V')" >> $GITHUB_ENV
      - name: Claude plans the day
        if: steps.ctx.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.token.outputs.value }}
          github_token: ${{ github.token }}   # the planner only writes files; no Claude GitHub App needed
          allowed_bots: 'github-actions'   # kick.mjs (Publish workflow) starts this run with the workflow token
          prompt: |
            Today is ${{ env.TODAY }}. Project: ${{ matrix.project }} (folder projects/${{ matrix.project }}/).
            Read planner/PLAN.md and follow it exactly: first turn Alex's new review comments into lasting
            rules in brand/lessons.md (step 1b), on Mondays a report on last week, plan the one day
            in content/context/target-week.json (${{ steps.ctx.outputs.date }}), meet the quality bar (draft,
            then edit like a strict editor; check every Bible fact in data/statenvertaling), draft comment
            replies, and run the validator until it passes.
            Take your time - quality over speed.
          claude_args: >-
            --model claude-opus-5-5 --effort xhigh --fallback-model claude-sonnet-5-5 --max-turns 260
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node engine/cli/validate.mjs),Bash(node engine/cli/validate.mjs:*),Bash(ls:*)"
      - name: Validate (gate)
        if: steps.ctx.outputs.skip != 'true'
        run: node engine/cli/validate.mjs 2>&1 | tee -a run.log
      - name: Import into the studio
        if: steps.ctx.outputs.skip != 'true'
        env: { SECRETS: '${{ toJSON(secrets) }}' }
        run: node engine/cli/import-queue.mjs 2>&1 | tee -a run.log
      - name: Lessons learned (Alex's new review comments are rules in brand/lessons.md now)
        if: steps.ctx.outputs.skip != 'true'
        env: { SECRETS: '${{ toJSON(secrets) }}', GITHUB_TOKEN: '${{ github.token }}' }
        run: node engine/cli/lessons-learned.mjs 2>&1 | tee -a run.log
      - name: Keep a record in git
        if: steps.ctx.outputs.skip != 'true'
        env: { DAY: '${{ steps.ctx.outputs.date }}' }
        run: |
          git config user.name "Marketing engine"; git config user.email "engine@users.noreply.github.com"
          c=projects/$PROJECT/content
          git add $c/imported $c/used-verses.json $c/queue/_errors.json projects/$PROJECT/brand/lessons.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "plan $PROJECT: ${DAY:-$(TZ=Europe/Amsterdam date +%F)}" && git pull --rebase --autostash -q && git push)
      - name: Render (the Render workflow, three jobs side by side)
        if: steps.ctx.outputs.skip != 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/render.yml/dispatches" -f ref=main -f "inputs[project]=$PROJECT"
      - if: failure()
        uses: ./.github/actions/report-failure
