# By hand: generate background music beds with ElevenLabs Music into assets/music/ and commit them.
name: Music library
on:
  workflow_dispatch:
    inputs:
      moods: { description: 'Moods (comma separated, empty = all)', required: false, default: '' }
      count: { description: 'Tracks per mood', required: false, default: '1' }
      project: { description: 'Project whose studio keys to use', required: false, default: 'bijbelstudie' }
permissions: { contents: write, issues: write }
defaults: { run: { shell: bash } }
jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { PROJECT: '${{ inputs.project }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-engine
        with: { render: 'true' }
      - name: Generate
        env: { SECRETS: '${{ toJSON(secrets) }}' }
        run: node engine/cli/make-music.mjs "${{ inputs.moods }}" "${{ inputs.count }}" 2>&1 | tee -a run.log
      - name: Commit the library
        run: |
          git config user.name "Marketing engine"; git config user.email "engine@users.noreply.github.com"
          git add assets/music
          git diff --cached --quiet || (git commit -m "music library: $(date -u +%F)" && git pull --rebase --autostash -q && git push)
      - if: failure()
        uses: ./.github/actions/report-failure
