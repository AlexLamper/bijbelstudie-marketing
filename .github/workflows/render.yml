# Import + render for every enabled project: runs when specs land in projects/<id>/content/queue
# (e.g. written by Claude in chat), when started from elsewhere, or by hand after a failed render.
name: Render
on:
  push: { branches: [main], paths: ['projects/*/content/queue/**'] }
  repository_dispatch: { types: [render] }
  workflow_dispatch:
    inputs:
      project: { description: 'Only this project (empty = every enabled project)', required: false, default: '' }
concurrency: { group: render, cancel-in-progress: false }
permissions: { contents: write, issues: write }
defaults: { run: { shell: bash } }   # bash -eo pipefail: a failing script fails the step despite | tee
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT: ${{ inputs.project || github.event.client_payload.project }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-engine
        with: { render: 'true' }
      - name: Import queued specs
        env: { SECRETS: '${{ toJSON(secrets) }}' }
        run: node engine/cli/each.mjs engine/cli/import-queue.mjs 2>&1 | tee -a run.log
      - name: Keep a record in git
        run: |
          git config user.name "Marketing engine"; git config user.email "engine@users.noreply.github.com"
          git add -A projects/*/content/queue projects/*/content/imported
          git diff --cached --quiet || (git commit -m "import: $(date -u +%F)" && git pull --rebase --autostash -q && git push)
      - name: Render and notify
        env: { SECRETS: '${{ toJSON(secrets) }}' }
        run: node engine/cli/each.mjs engine/cli/render-pending.mjs 2>&1 | tee -a run.log
      - if: failure()
        uses: ./.github/actions/report-failure
