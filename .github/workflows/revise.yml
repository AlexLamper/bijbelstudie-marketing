# Started from the studio ("Aanpassingen naar Claude") for one project: Claude rewrites every item
# Alex marked for changes, then they are validated, imported and rendered again.
name: Revise
on:
  repository_dispatch: { types: [revise] }       # client_payload: { "project": "<id>" }
  workflow_dispatch:
    inputs:
      project: { description: 'Project id (empty = default project)', required: false, default: '' }
permissions: { contents: write, issues: write }
concurrency: { group: 'planner-${{ github.event.client_payload.project || inputs.project || ''default'' }}', cancel-in-progress: false }
defaults: { run: { shell: bash } }   # bash -eo pipefail: a failing script fails the step despite | tee
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Which project
        env: { PROJECT: '${{ github.event.client_payload.project || inputs.project }}' }
        run: echo "PROJECT=$(node engine/cli/projects.mjs --current)" >> $GITHUB_ENV
      - uses: ./.github/actions/setup-engine
        with: { render: 'true' }
      - name: Export context
        env: { SECRETS: '${{ toJSON(secrets) }}' }
        run: node engine/cli/export-context.mjs 2>&1 | tee -a run.log
      - name: Planner token (GitHub secret, or pasted in the studio)
        id: token
        env: { SECRETS: '${{ toJSON(secrets) }}' }
        run: node engine/cli/studio-secret.mjs CLAUDE_CODE_OAUTH_TOKEN
      - name: Today
        run: echo "TODAY=$(TZ=Europe/Amsterdam date '+%A %d %B %Y, ISO week %G-W%V')" >> $GITHUB_ENV
      - name: Claude revises the items
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.token.outputs.value }}
          prompt: |
            Today is ${{ env.TODAY }}. Project: ${{ env.PROJECT }} (folder projects/${{ env.PROJECT }}/).
            Read planner/REVISE.md and follow it exactly.
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node engine/cli/validate.mjs),Bash(node engine/cli/validate.mjs:*),Bash(ls:*)"
      - name: Validate (gate)
        run: node engine/cli/validate.mjs 2>&1 | tee -a run.log
      - name: Import into the studio
        env: { SECRETS: '${{ toJSON(secrets) }}' }
        run: node engine/cli/import-queue.mjs 2>&1 | tee -a run.log
      - name: Keep a record in git
        run: |
          git config user.name "Marketing engine"; git config user.email "engine@users.noreply.github.com"
          c=projects/$PROJECT/content
          git add $c/imported $c/used-verses.json $c/queue/_errors.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "revise $PROJECT: $(date -u +%F)" && git pull --rebase --autostash -q && git push)
      - name: Render and notify
        env: { SECRETS: '${{ toJSON(secrets) }}', GITHUB_TOKEN: '${{ github.token }}' }
        run: node engine/cli/render-pending.mjs 2>&1 | tee -a run.log
      - if: failure()
        uses: ./.github/actions/report-failure
