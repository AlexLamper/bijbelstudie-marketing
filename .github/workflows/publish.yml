# Every 30 minutes during the day, for every enabled project: publish APPROVED items whose time
# has come, and start the Revise workflow when Alex asked for changes in the studio.
name: Publish
on:
  schedule:
    - cron: '0,30 5-20 * * *'   # 06:00-22:30 Amsterdam (winter); GitHub may start a few minutes late
  workflow_dispatch: {}
concurrency: { group: publish, cancel-in-progress: false }
permissions: { contents: read, actions: write, issues: write }
defaults: { run: { shell: bash } }   # bash -eo pipefail: a failing script fails the step despite | tee
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRETS: ${{ toJSON(secrets) }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-engine
      - run: node engine/cli/each.mjs engine/cli/publish-due.mjs 2>&1 | tee -a run.log
      - run: node engine/cli/each.mjs engine/cli/revise-check.mjs 2>&1 | tee -a run.log
      - if: failure()
        uses: ./.github/actions/report-failure
