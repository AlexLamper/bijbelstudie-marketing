# Daily, for every enabled project: metrics per item, followers, new users, comments; competitors on Mondays.
name: Stats
on:
  schedule: [{ cron: '15 4 * * *' }]
  workflow_dispatch: {}
permissions: { contents: read, issues: write }
defaults: { run: { shell: bash } }   # bash -eo pipefail: a failing script fails the step despite | tee
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRETS: ${{ toJSON(secrets) }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-engine
      - run: node engine/cli/each.mjs engine/cli/collect-stats.mjs 2>&1 | tee -a run.log
      - if: failure()
        uses: ./.github/actions/report-failure
