<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render stage</title>
<style>
  @font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter-SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Lora"; src: url("../../assets/fonts/Lora-Variable.ttf"); font-weight: 400 700; }

  /* Theme tokens - overwritten per project from projects/<id>/project.json (theme) in setup() */
  :root {
    --accent: #0d9488; --accent-dark: #0f766e; --cta: #0d7a66; --accent-soft: #ccfbf1; --accent-faint: #f0fdfa;
    --ink: #111827; --ink-body: #374151; --ink-muted: #6b7280;
    --background: #f3f4f6; --surface: #ffffff; --panel: #152229; --line: #e5e7eb;
    --font-sans: Inter; --font-serif: Lora;
    --shadow-cta: 0 10px 24px -8px color-mix(in srgb, var(--cta) 55%, transparent);
    --m: 96px;
  }
  html, body { margin: 0; padding: 0; }
  body { overflow: hidden; background: var(--background); font-family: var(--font-sans), Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; overflow: hidden; overflow-wrap: break-word; }
  .abs { position: absolute; will-change: transform, opacity; }
  .full { left: 0; top: 0; width: 100%; height: 100%; }
  .serif { font-family: var(--font-serif), Lora, Georgia, serif; }

  /* photo backgrounds */
  .photo { object-fit: cover; }
  .scrim { background: linear-gradient(rgba(0,0,0,.50), rgba(0,0,0,.38) 45%, rgba(0,0,0,.58)); }

  /* phone mockup */
  .phone { box-sizing: border-box; padding: 14px; background: var(--ink); border-radius: 72px; }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 58px; overflow: hidden; background: var(--surface); }
  .phone .bar { height: 44px; display: flex; align-items: center; padding: 0 44px; font-weight: 600; font-size: 19px; color: var(--ink); background: var(--surface); }
  .phone img { display: block; width: 100%; }

  /* end card (approved 22 Oct 2026) */
  .end { background: var(--panel); }
  .end-inner { position: absolute; left: 160px; width: 760px; color: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .end-inner > * { will-change: transform, opacity; }
  .end .icon { width: 208px; height: 208px; display: block; }
  .end .wordmark { height: 62px; display: block; margin-top: 40px; }
  .end .headline { margin-top: 84px; font-weight: 700; font-size: 80px; line-height: 1.05; letter-spacing: -1.6px; text-wrap: balance; }
  .end .sub { margin-top: 26px; font-size: 36px; line-height: 1.4; color: rgba(255,255,255,.8); max-width: 680px; text-wrap: balance; }
  .end .cta { margin-top: 64px; background: var(--cta); border-radius: 22px; padding: 34px 84px; font-weight: 700; font-size: 50px; letter-spacing: -.4px; box-shadow: var(--shadow-cta); }
  .end .badges { margin-top: 52px; display: flex; gap: 24px; align-items: center; }
  .end .badges img { height: 92px; display: block; }
  .end .web { margin-top: 30px; font-size: 30px; color: rgba(255,255,255,.7); }

  /* captions */
  .cap { left: 120px; width: 840px; top: 1430px; display: flex; justify-content: center; }
  .cap span { background: color-mix(in srgb, var(--panel) 88%, transparent); color: #fff; font-weight: 700; font-size: 50px; line-height: 1.2; padding: 16px 26px; border-radius: 18px; text-align: center; letter-spacing: -.3px; }
  /* karaoke subtitles: big outlined words, the spoken word on a teal pill */
  .cap.karaoke span { background: none; padding: 0; font-weight: 800; font-size: 66px; line-height: 1.25; letter-spacing: -.5px; color: #fff;
    -webkit-text-stroke: 7px rgba(10,16,20,.9); paint-order: stroke fill; text-shadow: 0 6px 22px rgba(0,0,0,.35); }
  .cap.karaoke i { font-style: normal; display: inline-block; padding: 0 10px; border-radius: 14px; transition: none; }
  .cap.karaoke i.on { background: var(--accent); -webkit-text-stroke: 0; transform: scale(1.06); }
  .cap.karaoke i.done { color: #fff; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ---------- helpers ---------- */
// ctx comes from render.mjs: the project's theme, logo/badge/photo/screenshot URLs and texts.
let ctx = { logos: {}, badges: [], shots: {}, photo: n => '', endCard: {}, verse: { translation: 'SV', eyebrow: 'VERS VAN DE DAG' } };
const clamp = x => Math.min(1, Math.max(0, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const out = x => 1 - Math.pow(1 - x, 3);
const inout = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || stage).appendChild(e); return e; };
const img = (src, cls, parent) => { const i = el('img', cls, parent); i.src = src; return i; };
const css = (e, o) => Object.assign(e.style, o);
const set = (e, o, y = 0, s = 1, x = 0) => { e.style.opacity = o; e.style.transform = `translate(${x}px,${y}px) scale(${s})`; };
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const photoSrc = n => `${ctx.photoBase}${String(n).padStart(3, '0')}.jpg`;
const shotSrc = s => ctx.shots[s]?.url || `${ctx.shotBase}${s}.png`;
const vref = ref => esc(`${ref} ${ctx.verse.translation}`.trim()).toUpperCase();
const stage = document.getElementById('stage');

/** fit a font size to text length: [[maxChars, px], ...]; with width, also small enough that the
 *  longest word fits on one line (Dutch has long compounds: "negenhonderdnegenenzestig"). */
const fit = (text, steps, width = 830) => {
  let px = steps[steps.length - 1][1]; for (const [n, v] of steps) if (text.length <= n) { px = v; break; }
  const longest = Math.max(...String(text).split(/\s+/).map(w => w.length));
  return Math.min(px, Math.floor(width / (longest * 0.6)));
};

/** Split text into caption chunks of ~5 words / 30 chars. */
function chunks(text) {
  const words = text.split(/\s+/); const res = []; let cur = [];
  for (const w of words) { cur.push(w); const s = cur.join(' '); if (s.length > 26 || /[.,;:?!]$/.test(w) && s.length > 14) { res.push(s); cur = []; } }
  if (cur.length) res.push(cur.join(' '));
  return res;
}

function phone(parent, shot, w) {
  const sz = ctx.shots[shot] || { w: 1170, h: 2391 };   // real screenshot size, so any device ratio fits
  const h = Math.round((w - 28) * sz.h / sz.w + 44 + 28);
  const p = el('div', 'abs phone', parent); css(p, { width: w + 'px', height: h + 'px' });
  const s = el('div', 'screen', p); el('div', 'bar', s, '9:41'); img(shotSrc(shot), '', s);
  return { node: p, h };
}

function endCard(spec, top = 420) {
  const e = spec.endCard || {}; const d = ctx.endCard;
  const card = el('div', 'abs full end');
  const inner = el('div', 'end-inner', card); inner.style.top = top + 'px';
  const parts = [
    img(ctx.logos.iconOnDark, 'icon', inner),
    img(ctx.logos.wordmarkOnDark, 'wordmark', inner),
    el('div', 'headline', inner, esc(e.headline || d.headline || '')),
  ];
  if (e.sub || d.sub) parts.push(el('div', 'sub', inner, esc(e.sub || d.sub)));
  parts.push(el('div', 'cta', inner, esc(e.button || d.button || 'Download gratis')));
  if (ctx.badges.length) { const badges = el('div', 'badges', inner); ctx.badges.forEach(b => img(b, '', badges)); parts.push(badges); }
  if (d.web) parts.push(el('div', 'web', inner, esc(d.web)));
  return (t, start) => {            // start = when the card begins sliding up
    const k = inout(prog(t, start, start + .38));
    card.style.transform = `translateY(${(1 - k) * 1920}px)`;
    parts.forEach((p, i) => {
      const a = start + .2 + i * .07; const q = out(prog(t, a, a + .32));
      const pulse = p.classList.contains('cta') ? .04 * Math.sin(Math.PI * prog(t, start + 1.0, start + 1.4)) : 0;
      set(p, q, (1 - q) * 28, (p.classList.contains('icon') ? .9 + .1 * q : 1) + pulse);
    });
  };
}
const END = 2.8; // end card length in reels (2-3 s, approved rule)

/* ---------- shared: spoken units, subtitles, looks ---------- */
// A template that speaks registers T[kind].units = spec => [{ text, pause? }]. render.mjs voices each
// unit and passes timing[i] = { dur, words: [{ w, a, b }] } (times relative to the unit start), or
// null when the reel is silent. layout() puts the units on one clock; render.mjs mixes the voice
// with the same starts (returned by setup), so picture and sound always line up.
const est = text => Math.max(1.4, String(text).length / 14);
function layout(units, timing) {
  let at = .3;
  return units.map((u, i) => {
    at += u.pause || 0;
    const tm = timing?.[i]; const dur = tm ? (typeof tm === 'number' ? tm : tm.dur) : (u.dur || est(u.text));
    const s = { ...u, start: at, dur, words: tm?.words || null }; at += dur + .25; return s;
  });
}
const endOf = segs => segs.length ? segs[segs.length - 1].start + segs[segs.length - 1].dur : 0;
const hasVoice = spec => !!spec.voice && spec.voice !== 'none';

/** Word times on the reel clock: real ones from the voice, else spread over the unit by length. */
function wordTimes(seg) {
  if (seg.words?.length) return seg.words.map(w => ({ w: w.w, a: seg.start + w.a, b: seg.start + w.b }));
  const ws = String(seg.text).split(/\s+/).filter(Boolean); const total = ws.reduce((n, w) => n + w.length + 1, 0); let a = seg.start;
  return ws.map(w => { const d = seg.dur * (w.length + 1) / total; const r = { w, a, b: a + d }; a += d; return r; });
}

/** Burned-in subtitles. 'block': the current few words. 'karaoke': same, the spoken word lit up. 'none'. */
function subtitles(segs, mode = 'block', { top = 1430 } = {}) {
  if (mode === 'none') return () => {};
  const k = mode === 'karaoke';
  const cap = el('div', 'abs cap' + (k ? ' karaoke' : '')); cap.style.top = top + 'px'; cap.style.opacity = 0;
  const span = el('span', '', cap);
  const groups = [];
  for (const s of segs) {
    if (s.noCap) continue; let cur = [];
    for (const w of wordTimes(s)) {
      cur.push(w); const txt = cur.map(x => x.w).join(' ');
      if (txt.length > (k ? 18 : 26) || (/[.,;:?!]$/.test(w.w) && txt.length > 10)) { groups.push(cur); cur = []; }
    }
    if (cur.length) groups.push(cur);
  }
  let shown = null;
  return t => {
    const i = groups.findIndex((g, i) => t >= g[0].a - .05 && t < Math.min(groups[i + 1]?.[0].a ?? 1e9, g[g.length - 1].b + .5));
    const g = groups[i];
    if (!g) { cap.style.opacity = 0; return; }
    cap.style.opacity = 1;
    if (k) span.innerHTML = g.map(w => `<i class="${t >= w.a - .02 ? (t < w.b + .04 ? 'on' : 'done') : ''}">${esc(w.w)}</i>`).join(' ');
    else if (shown !== g) span.textContent = g.map(w => w.w).join(' ');
    shown = g;
  };
}

/** Looks: light (white ground), dark (brand panel), photo (calm landscape + scrim). Paints the ground. */
const LOOKS = {
  light: { ink: 'var(--ink)', body: 'var(--ink-body)', muted: 'var(--ink-muted)', accent: 'var(--accent)', accentText: 'var(--accent-dark)', card: 'var(--accent-faint)', line: 'var(--line)', dark: false },
  dark: { ink: '#fff', body: 'rgba(255,255,255,.82)', muted: 'rgba(255,255,255,.6)', accent: 'var(--accent)', accentText: 'var(--accent-soft)', card: 'rgba(255,255,255,.08)', line: 'rgba(255,255,255,.18)', dark: true },
};
LOOKS.photo = { ...LOOKS.dark, card: 'rgba(0,0,0,.34)' };
const hashNo = (s, n) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return 1 + (h % Math.max(1, n)); };
function ground(look, spec, photoNo) {
  const L = LOOKS[look] || LOOKS.light;
  stage.style.background = look === 'light' ? 'var(--surface)' : look === 'dark' ? 'var(--panel)' : '#000';
  let bg = null;
  if (look === 'photo') { bg = img(photoSrc(photoNo || hashNo(spec.id, ctx.photoCount || 365)), 'abs full photo'); el('div', 'abs full scrim'); }
  let glow = null;   // dark look: a soft teal light drifting behind the content
  if (look === 'dark') { glow = el('div', 'abs'); css(glow, { left: '-300px', top: '-200px', width: '1400px', height: '1400px', borderRadius: '50%', background: 'radial-gradient(closest-side, color-mix(in srgb, var(--accent) 26%, transparent), transparent)' }); }
  return { ...L, look, bg, glow, logo: L.dark ? ctx.logos.iconOnDark : ctx.logos.full };
}
/** Slow background motion for a look: Ken Burns on photos, drifting glow on dark. */
function drift(L, t, duration) {
  if (L.bg) L.bg.style.transform = `scale(${1 + .07 * (t / duration)})`;
  if (L.glow) { const k = t / Math.max(1, duration); L.glow.style.transform = `translate(${-80 + 260 * k}px, ${60 + 520 * Math.sin(Math.PI * k)}px)`; }
}
/** Small logo lockup for a corner of a slide or reel (respects the dark/light logo rule). */
function lockup(parent, L, h = 52) {
  const box = el('div', '', parent); css(box, { display: 'flex', alignItems: 'center', gap: Math.round(h * .3) + 'px' });
  if (L.dark) { img(ctx.logos.iconOnDark, '', box).style.height = h + 'px'; img(ctx.logos.wordmarkOnDark, '', box).style.height = Math.round(h * .6) + 'px'; }
  else img(ctx.logos.full, '', box).style.height = h + 'px';
  return box;
}

/* ---------- templates (templates/*.js register on T) ---------- */
const T = {};
</script>
<script src="templates/base.js"></script>
<script src="templates/formats.js"></script>
<script>
/* ---------- entry ---------- */
let current;
/** The spoken units of a voiced spec (render.mjs voices them), or null for a silent reel. */
window.units = spec => { const t = T[spec.kind]; return t?.units && hasVoice(spec) ? t.units(spec) : null; };
window.setup = async (spec, timing, context) => {
  const t = T[spec.kind]; if (!t) throw new Error('No template for ' + spec.kind);
  if (context) {
    ctx = { ...ctx, ...context };
    const root = document.documentElement.style;
    const map = { accent: '--accent', accentDark: '--accent-dark', cta: '--cta', accentSoft: '--accent-soft', accentFaint: '--accent-faint',
      ink: '--ink', inkBody: '--ink-body', inkMuted: '--ink-muted', background: '--background', surface: '--surface', panel: '--panel', line: '--line' };
    for (const [k, v] of Object.entries(ctx.theme || {})) if (map[k]) root.setProperty(map[k], v);
    if (ctx.theme?.fontSans) root.setProperty('--font-sans', `"${ctx.theme.fontSans}"`);
    if (ctx.theme?.fontSerif) root.setProperty('--font-serif', `"${ctx.theme.fontSerif}"`);
    for (const f of ctx.fonts || []) document.fonts.add(await new FontFace(f.family, `url("${f.url}")`, { weight: f.weight || '400' }).load());
  }
  current = t(spec, timing);
  css(stage, { width: current.width + 'px', height: current.height + 'px' });
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => { throw new Error('Image failed: ' + i.src); })));
  current.render(current.duration ? current.duration - .05 : 0);
  return { width: current.width, height: current.height, duration: current.duration, starts: current.starts || null, slides: current.slides || 0 };
};
/** Carousels: show slide i (0-based) for the screenshot. */
window.slide = i => current.showSlide(i);
window.render = t => current.render(t);
</script>
</body>
</html>
